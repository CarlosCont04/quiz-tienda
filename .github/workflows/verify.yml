name: Verify dependence quiz
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-ci-only
          MYSQL_DATABASE: quiz_tienda
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -plocal-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: quiz_tienda
      DB_USER: root
      DB_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
      - run: npm ci
      - run: npm test
      - run: npm run test:api
      - run: npm run build:xampp
