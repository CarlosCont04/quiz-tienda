name: Verificar test de dependencia
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring
      - run: npm ci
      - run: npm test
      - run: npm run test:api
      - run: npm run build:xampp
      - run: npm run build:hosting
      - run: npm run test:hosting
